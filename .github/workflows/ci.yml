name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep this list in sync with the 'format' target in the Makefile
      # and with the reminder in AGENTS.md.
      - uses: haskell-actions/run-ormolu@v17
        with:
          pattern: |
            src/**/*.hs
            embed/**/*.hs
            app/**/*.hs
            codegen/**/*.hs
            test/**/*.hs
            bench/**/*.hs
            examples/**/*.hs
            playground/**/*.hs

  # Compile-only check across the whole supported GHC range. The full test
  # suite needs Guile and pytest, so it runs once (in 'test') on the primary
  # compiler; this job exists to catch base-API drift on older and newer
  # releases. Keep this matrix in sync with 'tested-with' in ychr.cabal.
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.6.6", "9.8.4", "9.10.1", "9.12.2", "9.14.1"]
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "latest"

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-build-ghc-${{ matrix.ghc }}-${{ hashFiles('ychr.cabal') }}
          restore-keys: |
            ${{ runner.os }}-build-ghc-${{ matrix.ghc }}-

      - run: cabal update
      - run: cabal build all --enable-tests --enable-benchmarks

  # Packaging gate: the package must be acceptable to Hackage, and the
  # sdist must be self-contained enough to build and test on its own.
  # 'test/golden/' is test data, so it has to be in extra-source-files.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "latest"

      - run: cabal update
      - run: cabal check

      - name: Build and test from the sdist tarball
        run: |
          cabal sdist
          mkdir -p /tmp/sdist-check
          tar xzf dist-newstyle/sdist/ychr-*.tar.gz -C /tmp/sdist-check
          cd /tmp/sdist-check/ychr-*
          cabal build all --enable-tests
          cabal test --enable-tests

      - name: Build Haddock documentation as Hackage would
        run: |
          cd /tmp/sdist-check/ychr-*
          cabal haddock --haddock-for-hackage

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.12.2"]
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Guile and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y guile-3.0
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-xdist

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('ychr.cabal') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: cabal update
        run: cabal update

      # Exercises ychr-codegen end to end: it compiles the generator,
      # runs it on the real libraries/ and typechecker/ sources, and
      # parses and typechecks the result with GHC — so a broken emitter
      # fails here rather than in a later MicroHs build. The MicroHs
      # build itself, which is the only other consumer of the output,
      # runs in the 'microhs' job below, without tests.
      - name: make resources
        run: make resources

      - name: make resources-check
        run: make resources-check

      - name: make test
        run: make test GUILE=guile-3.0

      - name: make bench
        run: make bench

  # Compile-only check under MicroHs, the second consumer of the resources
  # `make resources` generates and the only check that the tree still
  # builds under a compiler other than GHC. No tests run here: the MicroHs
  # package set has no tasty/hedgehog, so the test suite, the benchmark and
  # the stlc example are GHC-only (dev-docs/MICROHS_GAPS.md records that
  # and the divergences that remain); the gate is that the build produces
  # the executable.
  #
  # This is a normal build, not a dry one. MicroHs does have a no-code
  # mode — 'mhs -fno-code' prints "No code generated" — but it cannot
  # stand in for a package build: mcabal builds a library with '-P', which
  # mhs checks before -fno-code, so the flag is ignored there; on an
  # executable it *is* honoured and mhs then generates nothing, while
  # mcabal still exits 0 because it never checks. mcabal's only other dry
  # flag, '--dry-run', prints the commands without building anything.
  #
  # The environment is not the job's own: `make mhs-install` builds the
  # same pinned one a developer gets, from tools/mhs-install.sh and
  # tools/mhs-packages.txt, and the steps below only add a cache for it.
  microhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHC is here only for the resources half of `make mhs-build`:
      # ychr-codegen decodes libraries/*.chr and typechecker/*.chr into the
      # literal modules under generated/ that the MicroHs executable
      # compiles (dev-docs/MICROHS_PERFORMANCE.md, option B).
      - uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: "9.12.2"
          cabal-version: "latest"

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-microhs-ghc-9.12.2-${{ hashFiles('ychr.cabal') }}
          restore-keys: |
            ${{ runner.os }}-microhs-ghc-9.12.2-

      # Keyed on the two files that carry the pins, so bumping one starts
      # from a clean package set. No restore-keys: the compiled packages
      # are tied to the compiler that built them. A stale cache would not
      # be trusted anyway — `make mhs-install` installs whenever its own
      # stamp no longer matches the pins.
      - name: Cache MicroHs
        uses: actions/cache@v4
        with:
          path: ~/.mcabal
          key: ${{ runner.os }}-mcabal-${{ hashFiles('tools/mhs-install.sh', 'tools/mhs-packages.txt') }}

      # The pinned toolchain and package set, from the same command the
      # "MicroHs environment" section of the Makefile documents.
      - name: make mhs-install
        run: |
          make mhs-install
          echo "$HOME/.mcabal/bin" >> "$GITHUB_PATH"

      - run: cabal update

      # The documented MicroHs build order — regenerate the resources with
      # GHC, then compile with mcabal — and the end of the gate. The
      # 'test -x' guards the false success described above: mcabal reports
      # success even when mhs produced no binary.
      - name: make mhs-build
        run: |
          make mhs-build
          test -x dist-mcabal/bin/mhs/ychr
